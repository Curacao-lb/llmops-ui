server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Compose 重建 API 容器后 IP 会变化；通过 Docker DNS 定期重新解析服务名。
    resolver 127.0.0.11 valid=1s ipv6=off;
    resolver_timeout 2s;
    set $api_upstream llmops-api:5001;

    # 移除前端使用的 /api 前缀，再转发到后端路由。
    location /api/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://$api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_buffering off;
    }

    # 静态资源使用长期缓存；Vite 构建产物的文件名包含内容哈希。
    location ~* \.(?:css|js|jpe?g|gif|svg|woff|woff2|eot|ttf|otf|ico|webp)$ {
        expires 1y;
        add_header Cache-Control "public, no-transform";
        try_files $uri =404;
    }

    # Vue Router history 模式：刷新子路由时回退到 index.html。
    location / {
        try_files $uri $uri/ /index.html;
    }
}
